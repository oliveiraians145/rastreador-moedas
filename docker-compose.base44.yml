services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - pip install --no-cache-dir --quiet requests && exec python -u preview.py
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=10)"
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
